---
name: Tests

on:
  pull_request: ~
  push:
    branches: [ main ]

  # Allow job to be triggered manually.
  workflow_dispatch:

# Cancel in-progress jobs when pushing to the same branch.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:

  tests:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-15"
          - "macos-15-intel"
          #- "macos-26-intel"  # FIXME: ValueError: Failed detecting start date
          #- "macos-latest"    # FIXME: ValueError: Failed detecting start date
          - "windows-latest"
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}
      TZ: Europe/Berlin

    name: Python ${{ matrix.python-version }} on OS ${{ matrix.os }}
    steps:

    - name: Install German locales
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update && sudo apt-get install tzdata locales -y && sudo locale-gen de_DE.UTF-8

    - name: Configure timezone
      uses: szenius/set-timezone@v2.0
      with:
        timezoneLinux: "Europe/Berlin"
        timezoneMacos: "Europe/Berlin"
        timezoneWindows: "European Standard Time"

    - name: Acquire sources
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        activate-environment: 'true'
        cache-suffix: ${{ matrix.python-version }}
        enable-cache: 'true'
        python-version: ${{ matrix.python-version }}

    - name: Install project
      run: |
        uv pip install pip
        uv pip install --editable='.[develop,test]'

    - name: Run linter and software tests
      run: |
        poe check

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        env_vars: OS,PYTHON
        fail_ci_if_error: true
